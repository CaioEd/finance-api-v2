[project]
name = "finance-api"
version = "0.1.0"
description = "API REST de finanças pessoais"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Geração de PDF (fase 5). Fica confinada a `core/pdf.py`: é o único módulo
    # do projeto que a importa, e é o que permite trocá-la sem tocar em domínio.
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    # O TestClient do Starlette fala httpx2; com só o httpx ele ainda funciona,
    # mas avisa que a ponte está depreciada. Quem usa é a suíte de API.
    "httpx2>=2.12",
    # Driver do SQLite em memória de `tests/api/`. Não entra em `dependencies`:
    # a aplicação roda em Postgres, e só ele.
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `sources` remove o prefixo src/ na instalação: os módulos ficam no topo
# (main, api, health, core.*, domains.*), que é como o código se importa.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# extend-exclude, não exclude: `exclude` substituiria a lista padrão do ruff
# (.venv, .git, build...) em vez de somar a ela.
# O documento de arquitetura tem trechos ilustrativos de código; não é fonte.
extend-exclude = ["docs"]
# Todo cache de ferramenta em .cache/, para não espalhar pastas na raiz.
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # datetimes sem timezone
    "T20",      # print esquecido
    "SIM",      # simplificações
    "PTH",      # pathlib em vez de os.path
    "RUF",
]
ignore = [
    "B008",  # Depends(...) no default de argumento é o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Migration é código gerado: importa `op`/`sa` sempre, use ou não.
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "cli",
    "core",
    "dependencies",
    "main",
    "models",
    "repositories",
    "schemas",
    "services",
    "version",
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
cache_dir = ".cache/mypy"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# O reportlab não publica tipos (nem `py.typed`, nem stubs oficiais), então os
# símbolos dele chegam como `Any`. Fica contido: quem o importa é só
# `core/pdf.py`, e nada de reportlab atravessa a fronteira desse módulo — o
# domínio conversa com ele por dataclasses tipadas (`Document`, `TableBlock`).
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: exige um Postgres real (serviço db-test)",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["src"]
branch = true
data_file = ".cache/coverage"
# A ponte async do SQLAlchemy roda dentro de um greenlet, e sem declarar isso
# o rastreador perde tudo que executa depois de um await no banco: o relatório
# acusava 51% no auth_service, que os testes cobrem de ponta a ponta.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Corpo de método de Protocol: é declaração de contrato, não código que roda.
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
