[project]
name = "finance-api"
version = "0.1.0"
description = "API REST de finanças pessoais"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "time-machine>=2.15",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# extend-exclude, não exclude: `exclude` substituiria a lista padrão do ruff
# (.venv, .git, build...) em vez de somar a ela.
# O documento de arquitetura tem trechos ilustrativos de código; não é fonte.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # datetimes sem timezone
    "T20",      # print esquecido
    "SIM",      # simplificações
    "PTH",      # pathlib em vez de os.path
    "RUF",
]
ignore = [
    "B008",  # Depends(...) no default de argumento é o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Migration é código gerado: importa `op`/`sa` sempre, use ou não.
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["finance_api"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: exige um Postgres real (serviço db-test)",
]
